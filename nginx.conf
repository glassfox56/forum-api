# Install this file as /etc/nginx/sites-available/forum-api.
# It is included inside the main nginx.conf `http` block.

limit_req_zone $binary_remote_addr zone=threads_limit:10m rate=90r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # cloudflared connects locally and supplies the original visitor address.
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    location /threads {
        # Strict 90 requests/minute: no burst, one request every ~667 ms per IP.
        limit_req zone=threads_limit;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
