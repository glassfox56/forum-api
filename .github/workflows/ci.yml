name: Continuous Integration

on:
  pull_request:
    branches:
      - master

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: developer
          POSTGRES_PASSWORD: supersecretpassword
          POSTGRES_DB: forumapi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create test environment file
        run: |
          echo "PGHOST=localhost" > .test.env
          echo "PGPORT=5432" >> .test.env
          echo "PGUSER=developer" >> .test.env
          echo "PGPASSWORD=supersecretpassword" >> .test.env
          echo "PGDATABASE=forumapi_test" >> .test.env
          echo "DATABASE_URL=postgresql://developer:supersecretpassword@localhost:5432/forumapi_test" >> .test.env
          echo "PORT=5000" >> .test.env
          echo "ACCESS_TOKEN_KEY=${{ secrets.ACCESS_TOKEN_KEY }}" >> .test.env
          echo "REFRESH_TOKEN_KEY=${{ secrets.REFRESH_TOKEN_KEY }}" >> .test.env
          echo "ACCESS_TOKEN_AGE=3000" >> .test.env

      - name: Run database migrations
        run: npm run migrate:test up

      - name: Run unit and integration tests
        run: npm test
