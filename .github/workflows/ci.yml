name: Continuous Integration

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: developer
          POSTGRES_PASSWORD: supersecretpassword
          POSTGRES_DB: forumapi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create test environment file
        run: |
          printf '%s\n' \
            'HOST=localhost' \
            'PORT=3000' \
            'PGHOST=localhost' \
            'PGPORT=5432' \
            'PGUSER=developer' \
            'PGPASSWORD=supersecretpassword' \
            'PGDATABASE=forumapi_test' \
            'DATABASE_URL=postgresql://developer:supersecretpassword@localhost:5432/forumapi_test' \
            'ACCESS_TOKEN_KEY=ci_access_token_secret' \
            'REFRESH_TOKEN_KEY=ci_refresh_token_secret' \
            'ACCESS_TOKEN_AGE=3000' > .test.env

      - name: Run database migrations
        run: npm run migrate:test up

      - name: Run integration tests
        run: npm run test:integration

  functional-test:
    name: Functional Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: developer
          POSTGRES_PASSWORD: supersecretpassword
          POSTGRES_DB: forumapi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create test environment file
        run: |
          printf '%s\n' \
            'HOST=localhost' \
            'PORT=3000' \
            'PGHOST=localhost' \
            'PGPORT=5432' \
            'PGUSER=developer' \
            'PGPASSWORD=supersecretpassword' \
            'PGDATABASE=forumapi_test' \
            'DATABASE_URL=postgresql://developer:supersecretpassword@localhost:5432/forumapi_test' \
            'ACCESS_TOKEN_KEY=ci_access_token_secret' \
            'REFRESH_TOKEN_KEY=ci_refresh_token_secret' \
            'ACCESS_TOKEN_AGE=3000' > .test.env

      - name: Run database migrations
        run: npm run migrate:test up

      - name: Run functional tests
        run: npm run test:postmanV2
